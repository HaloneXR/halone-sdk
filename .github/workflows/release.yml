name: Release

# A tag such as 0.3.0 releases that version of every package: @halone/sdk
# and @halone/cli are staged on npm, where a maintainer approves them with 2FA
# (`npm stage list @halone/sdk`, then `npm stage approve <id>`), and
# dev.halone:plugin-sdk goes to Maven Central. The version comes from the tag,
# not from the files. A tag with a suffix (0.3.0-beta.1) goes to npm under
# `next` rather than `latest`.
#
# npm signs this workflow in through trusted publishing (OIDC), with no token;
# each package's trusted publisher allows only `npm stage publish`.

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: gradle/actions/setup-gradle@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Plugin SDK tests
        working-directory: android
        run: ./gradlew :plugin-sdk:testDebugUnitTest

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `npm stage` needs npm 11.15 or later, newer than Node 24 may bring.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - name: Version the packages from the tag
        run: pnpm -r --filter "./packages/*" exec npm pkg set version="$GITHUB_REF_NAME"

      - run: pnpm build

      # `npm stage` is unaware of workspaces, so each package is staged from
      # its own directory. Provenance comes with trusted publishing.
      - name: Stage for approval
        run: |
          channel=latest
          case "$GITHUB_REF_NAME" in *-*) channel=next ;; esac
          for package in packages/sdk packages/cli; do
            (cd "$package" && npm stage publish --access public --tag "$channel")
          done
          {
            echo "### Staged on npm, waiting for approval"
            echo
            echo "Approve each with 2FA, on npmjs.com (Staged Packages) or with:"
            echo
            echo '```'
            echo "npm stage list @halone/sdk"
            echo "npm stage list @halone/cli"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  maven:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :plugin-sdk:publishAndReleaseToMavenCentral -Phalone.version="$GITHUB_REF_NAME" --no-configuration-cache

  release:
    needs: [npm, maven]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
